<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Buku Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1.5rem;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 250px;
            padding: 15px;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }
        .price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }
        .btn:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <header>
        <h1>Toko Buku Digital</h1>
        <p>Temukan buku favoritmu di sini</p>
    </header>

    <div class="container">
        <!-- Buku 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Sampul Buku 1">
            <h3>Belajar HTML & CSS</h3>
            <p>Panduan dasar membuat website untuk pemula.</p>
            <div class="price">Rp 75.000</div>
            <button class="btn">Beli Sekarang</button>
        </div>

        <!-- Buku 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Sampul Buku 2">
            <h3>Pemrograman JavaScript</h3>
            <p>Kuasai logika interaktif web modern.</p>
            <div class="price">Rp 95.000</div>
            <button class="btn">Beli Sekarang</button>
        </div>

        <!-- Buku 3 -->
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Sampul Buku 3">
            <h3>Desain UI/UX Lengkap</h3>
            <p>Langkah mudah merancang tampilan aplikasi.</p>
            <div class="price">Rp 85.000</div>
            <button class="btn">Beli Sekarang</button>
        </div>
    </div>

</body>
</html>
